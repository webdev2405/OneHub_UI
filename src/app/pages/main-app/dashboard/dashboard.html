<!--begin::Container-->
<div class="container-fluid">
  <!--begin::Row-->
  <div class="row">
    <!--begin::Col-->
    <div class="col-xl-3 col-sm-6 col-12">
      
      <!--begin::Small Box Widget 1-->
      <div class="small-box text-bg-primary">
        <app-medium-box 
        title="Orginization" 
        [value]="10" 
        icon="cart-check-fill"
        iconBgColor="primary-color"
        badgeBgColor="info"
        >
      </app-medium-box>
      </div>
      <!--end::Small Box Widget 1-->
    </div>
    <!--end::Col-->
    <div class="col-xl-3 col-sm-6 col-12">
      <div class="small-box text-bg-primary">
        <app-medium-box 
        title="Branches" 
        [value]="50" 
        icon="shop-window"
        iconBgColor="secondary-color"
        badgeBgColor="danger"
        >
      </app-medium-box>
      </div>
    </div>
    <!--end::Col-->
    <div class="col-xl-3 col-sm-6 col-12">
      <div class="small-box text-bg-primary">
        <app-medium-box 
        title="Department" 
        [value]="100" 
        icon="people-fill"
        iconBgColor="success"
        badgeBgColor="success"
        >
      </app-medium-box>
      </div>
    </div>
    <!--end::Col-->
    <div class="col-xl-3 col-sm-6 col-12">
      <div class="small-box text-bg-primary">
        <app-medium-box 
        title="Division" 
        [value]="20" 
        icon="cart-check-fill"
        iconBgColor="warning"
        iconColor="text-muted"
        badgeBgColor="warning"
        badgeTextColor="muted"
        >
      </app-medium-box>
      </div>
    </div>
    <!--end::Col-->
  </div>
  <!--end::Row-->

 
  <!-- /.row (main row) -->
</div>
<!--end::Container-->
