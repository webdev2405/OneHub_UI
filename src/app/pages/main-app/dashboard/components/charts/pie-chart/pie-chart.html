<div class="my-chart p-3">
    <ngx-charts-pie-chart 
    [results]="data" 
     [scheme]="colorScheme()"
    [gradient]="gradient" 
    [legend]="showLegend"
    [legendPosition]="legendPosition" 
    [labels]="showLabels" 
    [doughnut]="isDoughnut" 
    (select)="onSelect($event)"
    (activate)="onActivate($event)" 
    (deactivate)="onDeactivate($event)"
    >
    </ngx-charts-pie-chart>
</div>
